jobs:
- id: buy_sell_alerts
  type: buy_sell_alerts
  enable: true
  cron: '*/15 9-11,13-15 * * MON-FRI'
  timezone: Asia/Shanghai
  rules_config: ./config/price_alerts.yaml
  alerts_config: ./config/alerts.yaml
  misfire_grace_time: 600
- id: earnings_monitor
  type: earnings_monitor
  enable: true
  cron: 30 8 * * *
  timezone: Asia/Shanghai
  earnings_config: ./config/earnings_monitor.yaml
  alerts_config: ./config/alerts.yaml
- id: holding_monitor_open
  type: holding_monitor
  enable: false
  cron: 25 9 * * MON-FRI
  timezone: Asia/Shanghai
  holdings_path: ./config/holdings.yaml
  alerts_config: ./config/alerts.yaml
  cooldown_hours: 4
  enable_regime: true
- id: holding_monitor_close
  type: holding_monitor
  enable: false
  cron: 5 15 * * MON-FRI
  timezone: Asia/Shanghai
  holdings_path: ./config/holdings.yaml
  alerts_config: ./config/alerts.yaml
  cooldown_hours: 4
  enable_regime: true
- id: news_scraper
  type: scraper
  scraper_type: news
  enable: false
  interval_minutes: 30
  scraper_config: ./config/scraper.yaml
  output_dir: ./output
- id: announcements_scraper
  type: scraper
  scraper_type: announcements
  enable: true
  cron: 0 18 * * MON-FRI
  timezone: Asia/Shanghai
  scraper_config: ./config/scraper.yaml
  output_dir: ./output
- id: holdings_scraper
  type: scraper
  scraper_type: holdings
  enable: true
  cron: 10 18 * * MON-FRI
  timezone: Asia/Shanghai
  scraper_config: ./config/scraper.yaml
  output_dir: ./output
- id: research_scraper
  type: scraper
  scraper_type: research
  enable: true
  cron: 0 9 * * MON-FRI
  timezone: Asia/Shanghai
  scraper_config: ./config/scraper.yaml
  output_dir: ./output
- id: daily_screening
  type: screener
  enable: true
  cron: 5 15 * * MON-FRI
  timezone: Asia/Shanghai
  screen_config: ./config/screen_config.yaml
  alerts_config: ./config/alerts.yaml
  output_dir: ./output
- id: ml_retrain
  type: ml_retrain
  enable: true
  cron: 0 18 1 * *
  timezone: Asia/Shanghai
  misfire_grace_time: 3600
  label_horizon_days: 20
  start_date: '2022-01-01'
  num_boost_round: 400
  n_splits: 3
- id: us_market_summary
  type: market_monitor
  enable: true
  cron: 30 8 * * MON-FRI
  timezone: Asia/Shanghai
  monitor_type: us_summary
  alerts_config: ./config/alerts.yaml
- id: market_sentiment_refresh
  type: market_monitor
  enable: true
  cron: 0,30 9-11,13-14 * * MON-FRI
  timezone: Asia/Shanghai
  monitor_type: sentiment_panel
  alerts_config: ./config/alerts.yaml
  misfire_grace_time: 300
