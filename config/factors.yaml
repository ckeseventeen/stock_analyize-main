active_profile: default
profiles:
  default:
    factors:
      - type: pe_ttm
        enabled: true
      - type: pb
        enabled: false
      - type: ps
        enabled: false
      - type: market_cap
        enabled: true
      - type: turnover_rate
        enabled: false
      - type: roe
        enabled: false
      - type: gross_margin
        enabled: false
      - type: revenue_growth
        enabled: false
      - type: amplitude
        enabled: false
      - type: return_nd
        enabled: false
        params:
          period: 20
      - type: rsi
        enabled: true
        params:
          period: 14
      - type: macd_bottom_divergence
        enabled: true
        params:
          lookback_bars: 60
      - type: price_above_ma
        enabled: false
        params:
          ma_period: 20
      # ML 预测因子（B 路径自学习）：未来 20 日相对沪深 300 超额收益预测
      # 需要先训练：python -m src.ml.cli train
      # 调度器会按 scheduler.yaml 中的 ml_retrain job 月度自动重训
      - type: ml_score
        enabled: false   # 默认关闭，训练完模型后置 true 启用
        params: {}
  value_oriented:
    factors:
      - type: pe_ttm
        enabled: true
      - type: pb
        enabled: true
      - type: market_cap
        enabled: true
      - type: roe
        enabled: true
      - type: gross_margin
        enabled: true
