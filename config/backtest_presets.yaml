# ============================================================
# 回测预设（2026-07 重写：与 screen_config.yaml 的 8 条新策略对齐）
# ============================================================
# 结构：
#   strategy: 策略 key（对应 STRATEGY_REGISTRY）
#   data:    数据参数（stock_code / days_back）
#   account: 账户参数（initial_cash / commission）
#   params:  策略专属参数（由 STRATEGY_PARAM_SCHEMAS 定义）
#
# screener_rule 预设 = 筛选策略的技术条件直接作为买卖信号回测；
# 也可在「策略回测」页侧栏「从筛选策略导入」一键带入任意策略。
# ============================================================

presets:

  # ── 与筛选策略对齐的 screener_rule 预设 ──

  质量价值白马_茅台:
    strategy: screener_rule
    data: {stock_code: "600519", days_back: 2000}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      buy_conditions:
        - type: price_above_ma
          ma_period: 120
      sell_conditions:
        - type: rsi_overbought
          threshold: 85
          period: 14
        - type: trailing_stop
          callback_pct: 12
          lookback: 60
      buy_logic: all
      sell_logic: any
      position_size: 0.95
    description: "质量价值白马（quality_value）：站上半年线持有，超买/回撤离场"

  低估底背离_平安:
    strategy: screener_rule
    data: {stock_code: "601318", days_back: 2000}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      buy_conditions:
        - type: weekly_macd_divergence
          lookback_bars: 60
          zero_axis_filter: true
      sell_conditions:
        - type: weekly_macd_top_divergence
          lookback_bars: 60
        - type: trailing_stop
          callback_pct: 15
          lookback: 60
      buy_logic: all
      sell_logic: any
      position_size: 0.9
    description: "低估值底背离反转（value_reversal）：周线底背离买入"

  成长动量_三花:
    strategy: screener_rule
    data: {stock_code: "002050", days_back: 1500}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      buy_conditions:
        - type: multi_ma_bull
          ma_list: [5, 10, 20, 60]
          require_all_above: true
          require_up_trend: true
        - type: volume_break
          lookback_bars: 20
          vol_multiple: 1.8
      sell_conditions:
        - type: ma_death_cross
          fast_period: 5
          slow_period: 20
        - type: atr_trailing_stop
          atr_period: 14
          multiplier: 3.0
          lookback: 20
      buy_logic: all
      sell_logic: any
      position_size: 0.9
    description: "成长动量多头（growth_momentum）：均线多头+放量进场"

  质量箱体突破_晶方:
    strategy: screener_rule
    data: {stock_code: "603005", days_back: 1500}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      buy_conditions:
        - type: box_breakout_volume
          lookback_bars: 60
          breakout_pct: 0.02
          consolidation_pct: 0.15
          vol_lookback: 20
          vol_multiple: 1.5
      sell_conditions:
        - type: break_below_ma
          ma_period: 20
          lookback: 3
        - type: trailing_stop
          callback_pct: 10
          lookback: 40
      buy_logic: all
      sell_logic: any
      position_size: 0.9
    description: "质量箱体突破（quality_breakout）：放量突破买入，破 MA20 离场"

  周期共振_通富:
    strategy: screener_rule
    data: {stock_code: "002156", days_back: 2000}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      buy_conditions:
        - type: weekly_macd_gold_cross
          require_zero_near: true
        - type: macd_hist_positive
          consecutive: 3
      sell_conditions:
        - type: weekly_macd_top_divergence
          lookback_bars: 60
        - type: ma_death_cross
          fast_period: 10
          slow_period: 30
      buy_logic: all
      sell_logic: any
      position_size: 0.9
    description: "多周期共振（trend_resonance）：周线定方向，日线找买点"

  # ── 经典基线预设（对照用）──

  双均线基线_茅台:
    strategy: ma_crossover
    data: {stock_code: "600519", days_back: 2000}
    account: {initial_cash: 100000, commission: 0.00025}
    params: {fast_period: 10, slow_period: 30}
    description: "经典双均线 10/30 基线（用于与新策略对照）"

  RSI反转基线:
    strategy: rule_based
    data: {stock_code: "600895", days_back: 1500}
    account: {initial_cash: 100000, commission: 0.00025}
    params:
      rule_config:
        indicators:
          rsi_14: {type: rsi, period: 14}
          ma_60: {type: sma, period: 60}
        buy_when:
          - "rsi_14 < 30"
          - "close > ma_60"
        sell_when:
          - "rsi_14 > 75"
        buy_logic: all
        sell_logic: any
    description: "RSI 超卖 + 站上 MA60 反弹基线"
