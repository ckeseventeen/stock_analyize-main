default_cooldown_hours: 24
buy_alerts:
  - id: TEST01
    name: 沪深300 布林带突破（买入）
    scopes:
      - csi300
    signal:
      type: bollinger_breakout
      params:
        direction: upper
    cooldown_hours: 24
    max_results: 20
    max_codes: 500
  - id: box_breakout
    name: 箱体突破
    enabled: true
    cooldown_hours: 24
    max_results: 20
    max_codes: 500
    scopes:
      - csi300
    signal:
      type: box_breakout_volume
      params:
        lookback_bars: 20
        breakout_pct: 0.02
sell_alerts: []
